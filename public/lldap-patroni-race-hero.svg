<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="LLDAP boot race against Patroni VIP — service diagram with LLDAP, Postgres cluster, Authelia and a retry loop">
  <title>LLDAP × Patroni VIP — boot race fix</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#6e2c9e"/>
      <stop offset="55%" stop-color="#35114d"/>
      <stop offset="100%" stop-color="#15061f"/>
    </radialGradient>
    <linearGradient id="boxFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="dbFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle dot grid (same rhythm as other hero svgs) -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="180" cy="60" r="2"/>
    <circle cx="300" cy="60" r="2"/>
    <circle cx="420" cy="60" r="2"/>
    <circle cx="540" cy="60" r="2"/>
    <circle cx="660" cy="60" r="2"/>
    <circle cx="780" cy="60" r="2"/>
    <circle cx="900" cy="60" r="2"/>
    <circle cx="1020" cy="60" r="2"/>
    <circle cx="1140" cy="60" r="2"/>
    <circle cx="60" cy="180" r="2"/>
    <circle cx="180" cy="180" r="2"/>
    <circle cx="300" cy="180" r="2"/>
    <circle cx="900" cy="180" r="2"/>
    <circle cx="1020" cy="180" r="2"/>
    <circle cx="1140" cy="180" r="2"/>
    <circle cx="60" cy="300" r="2"/>
    <circle cx="180" cy="300" r="2"/>
    <circle cx="1020" cy="300" r="2"/>
    <circle cx="1140" cy="300" r="2"/>
    <circle cx="60" cy="450" r="2"/>
    <circle cx="180" cy="450" r="2"/>
    <circle cx="300" cy="450" r="2"/>
    <circle cx="900" cy="450" r="2"/>
    <circle cx="1020" cy="450" r="2"/>
    <circle cx="1140" cy="450" r="2"/>
    <circle cx="60" cy="570" r="2"/>
    <circle cx="180" cy="570" r="2"/>
    <circle cx="300" cy="570" r="2"/>
    <circle cx="420" cy="570" r="2"/>
    <circle cx="540" cy="570" r="2"/>
    <circle cx="660" cy="570" r="2"/>
    <circle cx="780" cy="570" r="2"/>
    <circle cx="900" cy="570" r="2"/>
    <circle cx="1020" cy="570" r="2"/>
    <circle cx="1140" cy="570" r="2"/>
  </g>

  <!-- title -->
  <text x="600" y="92" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#ffffff" letter-spacing="1">
    LLDAP × Patroni VIP
  </text>
  <text x="600" y="122" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" font-weight="400" fill="#ffffff" fill-opacity="0.75" letter-spacing="2">
    boot race → Restart=on-failure, 10s, ∞
  </text>

  <!-- service chain: Authelia (left) ← LLDAP (center) → Postgres VIP (right) -->

  <!-- Authelia box (left) -->
  <g transform="translate(160 260)">
    <rect x="0" y="0" width="220" height="130" rx="14" ry="14"
          fill="url(#boxFill)" stroke="#ffffff" stroke-width="2"/>
    <!-- key icon -->
    <g transform="translate(40 65)" stroke="#ffd95c" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="14" fill="none"/>
      <circle cx="0" cy="0" r="5" fill="#ffd95c" stroke="none"/>
      <line x1="14" y1="0" x2="48" y2="0"/>
      <line x1="36" y1="0" x2="36" y2="12"/>
      <line x1="46" y1="0" x2="46" y2="8"/>
    </g>
    <text x="110" y="45" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="22" font-weight="700" fill="#ffffff">Authelia</text>
    <text x="110" y="92"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="500" fill="#ffffff" fill-opacity="0.7">OIDC provider</text>
    <text x="110" y="110"
          text-anchor="middle"
          font-family="monospace"
          font-size="12" font-weight="400" fill="#ffd95c" fill-opacity="0.85">Restart=always</text>
  </g>

  <!-- LLDAP box (center) -->
  <g transform="translate(490 240)">
    <rect x="0" y="0" width="220" height="170" rx="14" ry="14"
          fill="url(#boxFill)" stroke="#ffd95c" stroke-width="3"/>
    <!-- directory tree icon -->
    <g transform="translate(40 75)" stroke="#ffd95c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-18" y="-22" width="14" height="12" rx="2" fill="none"/>
      <line x1="-11" y1="-10" x2="-11" y2="8"/>
      <line x1="-11" y1="-2" x2="4" y2="-2"/>
      <line x1="-11" y1="8" x2="4" y2="8"/>
      <rect x="4" y="-8" width="14" height="12" rx="2" fill="none"/>
      <rect x="4" y="2" width="14" height="12" rx="2" fill="none"/>
    </g>
    <text x="110" y="45" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="22" font-weight="700" fill="#ffffff">LLDAP</text>
    <text x="110" y="92"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="500" fill="#ffffff" fill-opacity="0.75">user directory</text>
    <text x="110" y="112"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="500" fill="#ffffff" fill-opacity="0.75">node67 : 3890</text>
    <text x="110" y="145"
          text-anchor="middle"
          font-family="monospace"
          font-size="12" font-weight="700" fill="#ffd95c">Restart=on-failure</text>
    <text x="110" y="160"
          text-anchor="middle"
          font-family="monospace"
          font-size="11" font-weight="400" fill="#ffd95c" fill-opacity="0.85">RestartSec=10s</text>
  </g>

  <!-- Postgres / Patroni VIP (right) - database cylinder -->
  <g transform="translate(820 260)">
    <rect x="0" y="0" width="220" height="130" rx="14" ry="14"
          fill="url(#boxFill)" stroke="#ffffff" stroke-width="2"/>
    <!-- mini DB cylinder icon -->
    <g transform="translate(40 65)" stroke="#8ed6ff" stroke-width="2.5" fill="none">
      <ellipse cx="0" cy="-15" rx="18" ry="6" fill="rgba(142, 214, 255, 0.15)"/>
      <path d="M -18 -15 L -18 15"/>
      <path d="M 18 -15 L 18 15"/>
      <path d="M -18 15 C -18 19 18 19 18 15"/>
      <ellipse cx="0" cy="0" rx="18" ry="6" fill="none"/>
    </g>
    <text x="110" y="42" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#ffffff">Patroni VIP</text>
    <text x="110" y="63" text-anchor="middle"
          font-family="monospace"
          font-size="12" font-weight="500" fill="#8ed6ff">192.168.xxx.xx1:5432</text>
    <text x="110" y="92"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="12" font-weight="500" fill="#ffffff" fill-opacity="0.65">PostgreSQL HA</text>
    <text x="110" y="108"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="11" font-weight="400" fill="#ffffff" fill-opacity="0.55">node62 · 63 · 64 · 65</text>
  </g>

  <!-- arrow: LLDAP → Authelia (LDAP on localhost) -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="490" y1="325" x2="390" y2="325" stroke-dasharray="6 6"/>
    <path d="M 398 319 L 388 325 L 398 331"/>
  </g>
  <text x="440" y="315" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#ffffff" fill-opacity="0.6">
    ldap://
  </text>

  <!-- broken connection: LLDAP → Patroni VIP -->
  <g>
    <!-- connection line (mostly white) with broken X mark mid-way -->
    <line x1="710" y1="325" x2="770" y2="325" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
    <line x1="795" y1="325" x2="820" y2="325" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
    <!-- arrow head pointing into VIP -->
    <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 812 319 L 822 325 L 812 331"/>
    </g>
    <!-- red X showing broken -->
    <g stroke="#ff6b6b" stroke-width="4" stroke-linecap="round">
      <line x1="773" y1="312" x2="793" y2="338"/>
      <line x1="793" y1="312" x2="773" y2="338"/>
    </g>
    <!-- error label -->
    <text x="782" y="298" text-anchor="middle"
          font-family="monospace" font-size="11" fill="#ff6b6b" fill-opacity="0.9">
      No route to host
    </text>
  </g>

  <!-- retry loop around LLDAP (big circular arrow above the box) -->
  <g transform="translate(600 225)">
    <!-- arc -->
    <path d="M -80 0 A 80 34 0 1 1 80 0"
          fill="none" stroke="#ffd95c" stroke-width="4" stroke-linecap="round"/>
    <!-- arrow head at end -->
    <path d="M 72 -10 L 84 2 L 72 10"
          fill="none" stroke="#ffd95c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- retry label centered on arc apex -->
    <text x="0" y="-16" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14" font-weight="700" fill="#ffd95c">
      retry ∞
    </text>
  </g>

  <!-- caption / annotation (bottom) -->
  <text x="600" y="470" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400" fill="#ffffff" fill-opacity="0.75">
    network-online.target fire-a prije nego što Patroni izabere lidera —
  </text>
  <text x="600" y="490" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400" fill="#ffffff" fill-opacity="0.75">
    LLDAP se vrti u 10-sekundnoj restart petlji dok VIP ne dođe online.
  </text>

  <!-- bottom strip with node tags -->
  <g transform="translate(600 550)">
    <text x="-270" y="0" text-anchor="middle"
          font-family="monospace" font-size="11" fill="#ffffff" fill-opacity="0.55">
      node67 · router-7
    </text>
    <text x="0" y="0" text-anchor="middle"
          font-family="monospace" font-size="11" fill="#ffffff" fill-opacity="0.55">
      https://auth.hodi.ba → 200
    </text>
    <text x="270" y="0" text-anchor="middle"
          font-family="monospace" font-size="11" fill="#ffffff" fill-opacity="0.55">
      hetzner-1 · KVM
    </text>
  </g>
</svg>
