<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="KEP verifikator v0.16.1 — Halcom dodan kao 4. podržani ovjerilac, validan kvalifikovani elektronski potpis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fff4"/>
      <stop offset="100%" stop-color="#c6f6d5"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38a169"/>
      <stop offset="100%" stop-color="#22543d"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48bb78" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#48bb78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="newBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#dd6b20"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dotted grid -->
  <g fill="#9ae6b4" opacity="0.4">
    <circle cx="60" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/>
    <circle cx="900" cy="60" r="1.5"/><circle cx="1020" cy="60" r="1.5"/><circle cx="1140" cy="60" r="1.5"/>
    <circle cx="60" cy="570" r="1.5"/><circle cx="180" cy="570" r="1.5"/><circle cx="300" cy="570" r="1.5"/>
    <circle cx="900" cy="570" r="1.5"/><circle cx="1020" cy="570" r="1.5"/><circle cx="1140" cy="570" r="1.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="78" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" fill="#22543d">KEP verifikator v0.16.1</text>
  <text x="600" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#2f855a">4 podržana kvalifikovana ovjerioca</text>

  <!-- Central shield with checkmark -->
  <g transform="translate(600 310)">
    <circle r="135" fill="url(#ringGlow)"/>
    <circle r="115" fill="none" stroke="#9ae6b4" stroke-width="2" stroke-dasharray="6 8" opacity="0.8"/>
    <path d="M 0 -78 L 64 -50 L 64 22 Q 64 70 0 92 Q -64 70 -64 22 L -64 -50 Z" fill="url(#shieldFill)" stroke="#1c4532" stroke-width="2"/>
    <text x="0" y="-18" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2">KEP</text>
    <path d="M -28 22 L -8 44 L 30 0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Four provider badges -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- IDDEEA -->
    <g transform="translate(180 480)">
      <rect x="-90" y="-40" width="180" height="80" rx="10" fill="#ffffff" stroke="#38a169" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">IDDEEA</text>
      <text x="0" y="14" text-anchor="middle" font-size="11" fill="#4a5568">eID lična karta</text>
      <!-- check -->
      <circle cx="68" cy="-22" r="13" fill="#38a169"/>
      <path d="M 62 -22 L 66 -17 L 74 -27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- UIO -->
    <g transform="translate(420 480)">
      <rect x="-90" y="-40" width="180" height="80" rx="10" fill="#ffffff" stroke="#38a169" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">UIO</text>
      <text x="0" y="14" text-anchor="middle" font-size="11" fill="#4a5568">PDV certifikati</text>
      <circle cx="68" cy="-22" r="13" fill="#38a169"/>
      <path d="M 62 -22 L 66 -17 L 74 -27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- BHP -->
    <g transform="translate(660 480)">
      <rect x="-90" y="-40" width="180" height="80" rx="10" fill="#ffffff" stroke="#38a169" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">BHP</text>
      <text x="0" y="14" text-anchor="middle" font-size="11" fill="#4a5568">BH Pošta</text>
      <circle cx="68" cy="-22" r="13" fill="#38a169"/>
      <path d="M 62 -22 L 66 -17 L 74 -27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Halcom (new) -->
    <g transform="translate(900 480)">
      <rect x="-90" y="-40" width="180" height="80" rx="10" fill="#ffffff" stroke="#dd6b20" stroke-width="3"/>
      <text x="0" y="-10" text-anchor="middle" font-size="20" font-weight="700" fill="#22543d">Halcom</text>
      <text x="0" y="14" text-anchor="middle" font-size="11" fill="#4a5568">Halcom d.d. (SI)</text>
      <circle cx="68" cy="-22" r="13" fill="#38a169"/>
      <path d="M 62 -22 L 66 -17 L 74 -27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- NOVO ribbon -->
      <rect x="-78" y="-58" width="58" height="22" rx="11" fill="url(#newBadge)"/>
      <text x="-49" y="-43" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">NOVO</text>
    </g>
  </g>

  <!-- Validan KEP banner under shield -->
  <g transform="translate(600 408)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#38a169"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">VALIDAN KEP</text>
  </g>

  <!-- Footer URL -->
  <text x="600" y="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace" font-size="14" fill="#2f855a">provjeri.kep.hodi.ba</text>
</svg>
