<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0088cc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0088cc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#714B67" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Connection line -->
  <line x1="200" y1="315" x2="1000" y2="315" stroke="url(#line1)" stroke-width="3" stroke-dasharray="12 6"/>

  <!-- Telegram logo circle -->
  <circle cx="330" cy="315" r="110" fill="#0088cc" fill-opacity="0.15" stroke="#0088cc" stroke-width="2"/>
  <circle cx="330" cy="315" r="85" fill="#0088cc" fill-opacity="0.25"/>

  <!-- Telegram paper plane icon -->
  <g transform="translate(330,315) scale(1.8)">
    <path d="M-30 2 L30-15 L-10 10 Z" fill="#0088cc"/>
    <path d="M-10 10 L30-15 L5 25 Z" fill="#006699"/>
    <path d="M-10 10 L0 5 L5 25 Z" fill="#004d73"/>
  </g>

  <!-- Arrows -->
  <g transform="translate(540, 295)">
    <path d="M0 0 L80 0" stroke="#0088cc" stroke-width="2.5" stroke-opacity="0.7"/>
    <path d="M70 -8 L82 0 L70 8" fill="#0088cc" fill-opacity="0.7"/>
  </g>
  <g transform="translate(540, 335)">
    <path d="M80 0 L0 0" stroke="#714B67" stroke-width="2.5" stroke-opacity="0.7"/>
    <path d="M10 -8 L-2 0 L10 8" fill="#714B67" fill-opacity="0.7"/>
  </g>

  <!-- Odoo logo circle -->
  <circle cx="870" cy="315" r="110" fill="#714B67" fill-opacity="0.15" stroke="#714B67" stroke-width="2"/>
  <circle cx="870" cy="315" r="85" fill="#714B67" fill-opacity="0.25"/>

  <!-- Odoo icon - stylized -->
  <g transform="translate(870, 315)">
    <circle cx="-28" cy="0" r="18" fill="none" stroke="#714B67" stroke-width="4"/>
    <circle cx="28" cy="0" r="18" fill="none" stroke="#714B67" stroke-width="4"/>
    <circle cx="-28" cy="0" r="6" fill="#714B67"/>
    <circle cx="28" cy="0" r="6" fill="#714B67"/>
  </g>

  <!-- Title -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="1">
    Telegram + Odoo 16
  </text>
  <text x="600" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">
    OCA MAIL GATEWAY
  </text>

  <!-- Labels -->
  <text x="330" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#0088cc" fill-opacity="0.8" font-weight="600">
    Bot API
  </text>
  <text x="870" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#714B67" fill-opacity="0.8" font-weight="600">
    Discuss
  </text>
</svg>
