  <!-- Translation cards: English → Bosanski (Close → Zatvori), referencing the bug we fixed -->
  <g transform="translate(0, 410)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="-12" font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">PRIJEVODI</text>

