    <g transform="translate(180, 30)">
      <rect x="-92" y="-44" width="184" height="88" rx="12"
            fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="0" y="-15" font-size="14" font-weight="500" text-anchor="middle"
            fill="#ffffff" fill-opacity="0.5">English</text>
      <text x="0" y="20" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">Close</text>
    </g>

    <!-- arrow + .po marker -->
    <g transform="translate(345, 30)" filter="url(#glow)">
      <path d="M -55 0 L 55 0" stroke="url(#bsYellow)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 38 -10 L 60 0 L 38 10 Z" fill="url(#bsYellow)"/>
