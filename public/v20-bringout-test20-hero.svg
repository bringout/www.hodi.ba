    <!-- BS card -->
    <g transform="translate(510, 30)">
      <rect x="-92" y="-44" width="184" height="88" rx="12"
            fill="url(#bsBlue)" stroke="#ffd84d" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="0" y="-15" font-size="14" font-weight="500" text-anchor="middle"
            fill="#ffd84d" fill-opacity="0.85">Bosanski</text>
      <text x="0" y="20" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">Zatvori</text>
    </g>

    <!-- big % stat -->
    <g transform="translate(950, 30)" text-anchor="middle">
      <text x="0" y="-2" font-size="68" font-weight="700" fill="#ffffff">92.7<tspan font-size="48" fill="#ffffff" fill-opacity="0.7">%</tspan></text>
      <text x="0" y="32" font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.6">v20 bs pokrivenost</text>
    </g>
  </g>

  <!-- Bottom strip: key v20 module chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" text-anchor="middle">
    <g transform="translate(60, 565)">
      <rect width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="60" y="22" fill="#ffffff" fill-opacity="0.78">core</text>
    </g>
    <g transform="translate(192, 565)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="80" y="22" fill="#ffffff" fill-opacity="0.78">point_of_sale</text>
    </g>
    <g transform="translate(364, 565)">
      <rect width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="90" y="22" fill="#ffffff" fill-opacity="0.78">base_report_wkhtmltox</text>
    </g>
    <g transform="translate(556, 565)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="80" y="22" fill="#ffffff" fill-opacity="0.78">account_peppol</text>
    </g>
    <g transform="translate(728, 565)">
      <rect width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="70" y="22" fill="#ffffff" fill-opacity="0.78">auth_passkey</text>
    </g>
    <g transform="translate(880, 565)">
      <rect width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="60" y="22" fill="#ffffff" fill-opacity="0.78">website</text>
    </g>
    <g transform="translate(1012, 565)">
      <rect width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="64" y="22" fill="#ffffff" fill-opacity="0.78">…+89</text>
    </g>
  </g>
