      <text x="-12" y="0" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.85"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">19.4 alpha</text>
    </g>
  </g>

  <!-- Pipeline row: master → 17 forks → bringout-test20 -->
  <g transform="translate(0, 200)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">

    <!-- master card -->
    <g transform="translate(180, 0)">
      <rect x="-130" y="-65" width="260" height="130" rx="16"
