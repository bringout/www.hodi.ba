<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Odoo v20 sandbox na bringout-test20.hodi.ba — 89 modula, 92.7% bosanskog">
  <title>Odoo v20 sandbox: bringout-test20.hodi.ba — 92.7% bosanskog</title>
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#10243d"/>
      <stop offset="55%" stop-color="#06182c"/>
      <stop offset="100%" stop-color="#020713"/>
    </radialGradient>

    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="ocbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <linearGradient id="bsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3a7ad9"/>
      <stop offset="100%" stop-color="#1f4a96"/>
    </linearGradient>

    <linearGradient id="bsYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#e8b800"/>
    </linearGradient>

    <linearGradient id="hodiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle dot grid -->
  <g fill="#ffffff" fill-opacity="0.04">
    <circle cx="60"   cy="60"  r="2"/><circle cx="140"  cy="60"  r="2"/>
    <circle cx="220"  cy="60"  r="2"/><circle cx="300"  cy="60"  r="2"/>
    <circle cx="380"  cy="60"  r="2"/><circle cx="460"  cy="60"  r="2"/>
    <circle cx="540"  cy="60"  r="2"/><circle cx="620"  cy="60"  r="2"/>
    <circle cx="700"  cy="60"  r="2"/><circle cx="780"  cy="60"  r="2"/>
    <circle cx="860"  cy="60"  r="2"/><circle cx="940"  cy="60"  r="2"/>
    <circle cx="1020" cy="60"  r="2"/><circle cx="1100" cy="60"  r="2"/>
    <circle cx="60"   cy="140" r="2"/><circle cx="140"  cy="140" r="2"/>
    <circle cx="220"  cy="140" r="2"/><circle cx="300"  cy="140" r="2"/>
    <circle cx="380"  cy="140" r="2"/><circle cx="460"  cy="140" r="2"/>
    <circle cx="540"  cy="140" r="2"/><circle cx="620"  cy="140" r="2"/>
    <circle cx="700"  cy="140" r="2"/><circle cx="780"  cy="140" r="2"/>
    <circle cx="860"  cy="140" r="2"/><circle cx="940"  cy="140" r="2"/>
    <circle cx="1020" cy="140" r="2"/><circle cx="1100" cy="140" r="2"/>
  </g>

  <!-- Top wordmark + alpha tag -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="100" font-size="44" font-weight="700" fill="#ffffff" fill-opacity="0.95">Odoo</text>
    <text x="180" y="100" font-size="44" font-weight="700" fill="url(#masterGrad)">v20</text>
    <text x="280" y="100" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.55">sandbox</text>

    <g transform="translate(1140, 78)" text-anchor="end">
      <rect x="-152" y="-22" width="152" height="32" rx="16"
