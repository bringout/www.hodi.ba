      <text x="6" y="2" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">bringout/oca-ocb-*</text>
      <text x="6" y="34" font-size="14" font-weight="500" text-anchor="middle"
            fill="#ffffff" fill-opacity="0.6"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">grana 20.0</text>
    </g>

    <!-- arrow 2 -->
    <g filter="url(#glow)">
      <path d="M 740 0 L 890 0" stroke="url(#bsYellow)" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M 870 -14 L 898 0 L 870 14 Z" fill="url(#bsYellow)"/>
    </g>
    <text x="815" y="-22" font-size="12" font-weight="600" text-anchor="middle"
          fill="#ffd84d" letter-spacing="1">NIX BUNDLE</text>
    <text x="815" y="32" font-size="11" text-anchor="middle"
          fill="#ffffff" fill-opacity="0.5"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pkgs.odoo20 / python313</text>

    <!-- bringout-test20 card -->
    <g transform="translate(1020, 0)">
      <rect x="-130" y="-65" width="260" height="130" rx="16"
            fill="url(#hodiGrad)" fill-opacity="0.18"
            stroke="url(#hodiGrad)" stroke-width="2"/>
