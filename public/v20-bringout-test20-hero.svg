      <path d="M 320 0 L 470 0" stroke="url(#bsYellow)" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M 450 -14 L 478 0 L 450 14 Z" fill="url(#bsYellow)"/>
    </g>
    <text x="395" y="-22" font-size="12" font-weight="600" text-anchor="middle"
          fill="#ffd84d" letter-spacing="1">REFRESH</text>
    <text x="395" y="32" font-size="11" text-anchor="middle"
          fill="#ffffff" fill-opacity="0.5"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">refresh_v20_from_master.py</text>

    <!-- forks card (stack effect) -->
    <g transform="translate(600, 0)">
      <rect x="-130" y="-58" width="260" height="130" rx="16"
            fill="url(#ocbGrad)" fill-opacity="0.10"
            stroke="url(#ocbGrad)" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="-127" y="-61" width="260" height="130" rx="16"
            fill="url(#ocbGrad)" fill-opacity="0.14"
            stroke="url(#ocbGrad)" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="-124" y="-64" width="260" height="130" rx="16"
            fill="url(#ocbGrad)" fill-opacity="0.20"
