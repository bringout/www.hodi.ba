<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a4e"/>
      <stop offset="100%" stop-color="#263055"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Central payment icon -->
  <circle cx="600" cy="230" r="70" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Credit card icon -->
  <g transform="translate(600,230)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
    <line x1="-30" y1="-8" x2="30" y2="-8" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.7"/>
    <rect x="-22" y="2" width="16" height="8" rx="2" fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- Left branch: Email -->
  <g>
    <path d="M530 230 Q400 230 320 320" stroke="#f0c040" stroke-width="3" stroke-opacity="0.7" fill="none" stroke-dasharray="8 5"/>
    <circle cx="310" cy="330" r="50" fill="#f0c040" fill-opacity="0.15" stroke="#f0c040" stroke-width="2" stroke-opacity="0.7"/>
    <g transform="translate(310,330)">
      <rect x="-20" y="-14" width="40" height="28" rx="3" fill="none" stroke="#f0c040" stroke-width="2.5"/>
      <polyline points="-20,-14 0,4 20,-14" fill="none" stroke="#f0c040" stroke-width="2.5"/>
    </g>
    <text x="310" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#f0c040" font-weight="700">Email</text>
  </g>

  <!-- Right branch: Telegram -->
  <g>
    <path d="M670 230 Q800 230 880 320" stroke="#29b6f6" stroke-width="3" stroke-opacity="0.7" fill="none" stroke-dasharray="8 5"/>
    <circle cx="890" cy="330" r="50" fill="#29b6f6" fill-opacity="0.15" stroke="#29b6f6" stroke-width="2" stroke-opacity="0.7"/>
    <g transform="translate(890,330) scale(1.1)">
      <path d="M-22 2 L22-11 L-6 8 Z" fill="#29b6f6"/>
      <path d="M-6 8 L22-11 L4 18 Z" fill="#0288d1"/>
      <path d="M-6 8 L2 4 L4 18 Z" fill="#0277bd"/>
    </g>
    <text x="890" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#29b6f6" font-weight="700">Telegram</text>
  </g>

  <!-- Success badge -->
  <g transform="translate(480, 135)">
    <circle cx="14" cy="14" r="14" fill="#27c93f" fill-opacity="0.25" stroke="#4cff6e" stroke-width="2"/>
    <polyline points="6,14 11,19 22,8" fill="none" stroke="#4cff6e" stroke-width="2.5"/>
  </g>

  <!-- Error badge -->
  <g transform="translate(700, 135)">
    <circle cx="14" cy="14" r="14" fill="#ff5f56" fill-opacity="0.25" stroke="#ff8a80" stroke-width="2"/>
    <line x1="8" y1="8" x2="20" y2="20" stroke="#ff8a80" stroke-width="2.5"/>
    <line x1="20" y1="8" x2="8" y2="20" stroke="#ff8a80" stroke-width="2.5"/>
  </g>

  <!-- Label: Monri -->
  <text x="600" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.7" letter-spacing="4" font-weight="600">MONRI PAYMENT</text>

  <!-- Title -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="1">
    Payment Notifications
  </text>
  <text x="600" y="555" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.65" letter-spacing="2">
    EMAIL + TELEGRAM + HANGUP DETECTION
  </text>

  <!-- Module badges -->
  <g transform="translate(370, 575)">
    <rect width="150" height="26" rx="13" fill="#f0c040" fill-opacity="0.15" stroke="#f0c040" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="75" y="17" text-anchor="middle" font-family="monospace" font-size="12" fill="#f0c040">email_notify_monri</text>
  </g>
  <g transform="translate(540, 575)">
    <rect width="180" height="26" rx="13" fill="#29b6f6" fill-opacity="0.15" stroke="#29b6f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="90" y="17" text-anchor="middle" font-family="monospace" font-size="12" fill="#29b6f6">telegram_notify_monri</text>
  </g>
  <g transform="translate(740, 575)">
    <rect width="130" height="26" rx="13" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="65" y="17" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffffff" fill-opacity="0.8">telegram_notify</text>
  </g>
</svg>
