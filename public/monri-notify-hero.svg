<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a4e"/>
      <stop offset="100%" stop-color="#263055"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27c93f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#27c93f" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="errorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5f56" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff5f56" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Central payment icon -->
  <circle cx="600" cy="230" r="70" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
  <!-- Credit card icon -->
  <g transform="translate(600,230)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="-30" y1="-8" x2="30" y2="-8" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="-22" y="2" width="16" height="8" rx="2" fill="#ffffff" fill-opacity="0.3"/>
  </g>

  <!-- Left branch: Email -->
  <g>
    <!-- Connection line -->
    <path d="M530 230 Q400 230 320 320" stroke="#f0c040" stroke-width="2" stroke-opacity="0.4" fill="none" stroke-dasharray="6 4"/>
    <!-- Arrow -->
    <circle cx="310" cy="330" r="50" fill="#f0c040" fill-opacity="0.08" stroke="#f0c040" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Email icon -->
    <g transform="translate(310,330)">
      <rect x="-20" y="-14" width="40" height="28" rx="3" fill="none" stroke="#f0c040" stroke-width="2" stroke-opacity="0.8"/>
      <polyline points="-20,-14 0,4 20,-14" fill="none" stroke="#f0c040" stroke-width="2" stroke-opacity="0.8"/>
    </g>
    <text x="310" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#f0c040" fill-opacity="0.8" font-weight="600">Email</text>
  </g>

  <!-- Right branch: Telegram -->
  <g>
    <!-- Connection line -->
    <path d="M670 230 Q800 230 880 320" stroke="#0088cc" stroke-width="2" stroke-opacity="0.4" fill="none" stroke-dasharray="6 4"/>
    <!-- Arrow -->
    <circle cx="890" cy="330" r="50" fill="#0088cc" fill-opacity="0.08" stroke="#0088cc" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Telegram icon -->
    <g transform="translate(890,330) scale(0.9)">
      <path d="M-22 2 L22-11 L-6 8 Z" fill="#0088cc" fill-opacity="0.8"/>
      <path d="M-6 8 L22-11 L4 18 Z" fill="#006699" fill-opacity="0.8"/>
      <path d="M-6 8 L2 4 L4 18 Z" fill="#004d73" fill-opacity="0.8"/>
    </g>
    <text x="890" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#0088cc" fill-opacity="0.8" font-weight="600">Telegram</text>
  </g>

  <!-- Success notification -->
  <g transform="translate(480, 140)">
    <rect x="0" y="0" width="22" height="22" rx="11" fill="url(#successGrad)" stroke="#27c93f" stroke-width="1.5"/>
    <polyline points="5,11 9,15 17,7" fill="none" stroke="#27c93f" stroke-width="2"/>
  </g>

  <!-- Error notification -->
  <g transform="translate(700, 140)">
    <rect x="0" y="0" width="22" height="22" rx="11" fill="url(#errorGrad)" stroke="#ff5f56" stroke-width="1.5"/>
    <line x1="7" y1="7" x2="15" y2="15" stroke="#ff5f56" stroke-width="2"/>
    <line x1="15" y1="7" x2="7" y2="15" stroke="#ff5f56" stroke-width="2"/>
  </g>

  <!-- Label: Monri -->
  <text x="600" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.4" letter-spacing="3">MONRI PAYMENT</text>

  <!-- Title -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="1">
    Payment Notifications
  </text>
  <text x="600" y="555" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.4" letter-spacing="2">
    EMAIL + TELEGRAM + HANGUP DETECTION
  </text>

  <!-- Module badges -->
  <g transform="translate(370, 575)">
    <rect width="150" height="24" rx="12" fill="#f0c040" fill-opacity="0.1" stroke="#f0c040" stroke-width="1" stroke-opacity="0.3"/>
    <text x="75" y="16" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0c040" fill-opacity="0.7">email_notify_monri</text>
  </g>
  <g transform="translate(540, 575)">
    <rect width="180" height="24" rx="12" fill="#0088cc" fill-opacity="0.1" stroke="#0088cc" stroke-width="1" stroke-opacity="0.3"/>
    <text x="90" y="16" text-anchor="middle" font-family="monospace" font-size="11" fill="#0088cc" fill-opacity="0.7">telegram_notify_monri</text>
  </g>
  <g transform="translate(740, 575)">
    <rect width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
    <text x="65" y="16" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" fill-opacity="0.5">telegram_notify</text>
  </g>
</svg>
