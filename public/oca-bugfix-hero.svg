<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Code background panel -->
  <rect x="120" y="80" width="960" height="380" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window dots -->
  <circle cx="155" cy="110" r="7" fill="#ff5f56"/>
  <circle cx="180" cy="110" r="7" fill="#ffbd2e"/>
  <circle cx="205" cy="110" r="7" fill="#27c93f"/>

  <!-- Tab bar -->
  <rect x="120" y="125" width="960" height="1" fill="#30363d"/>

  <!-- Code: Bug 1 - strikethrough (old code) -->
  <text x="160" y="175" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#f85149" fill-opacity="0.6" text-decoration="line-through">
    request.httprequest.charset
  </text>
  <text x="555" y="175" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#8b949e">
    # AttributeError in Werkzeug 3.x
  </text>

  <!-- Arrow down -->
  <text x="160" y="205" font-family="'JetBrains Mono', monospace" font-size="18" fill="#3fb950">↓</text>

  <!-- Code: Bug 1 - fix (new code) -->
  <text x="160" y="235" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#3fb950">
    getattr(request.httprequest, "charset", "utf-8")
  </text>
  <text x="660" y="235" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#8b949e">
    # safe fallback
  </text>

  <!-- Separator -->
  <line x1="160" y1="270" x2="1040" y2="270" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Code: Bug 2 - strikethrough (old code) -->
  <text x="160" y="310" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#f85149" fill-opacity="0.6" text-decoration="line-through">
    t-if="!isRequired"
  </text>
  <text x="445" y="310" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#8b949e">
    # "Invalid fields" on single-option selection
  </text>

  <!-- Arrow down -->
  <text x="160" y="340" font-family="'JetBrains Mono', monospace" font-size="18" fill="#3fb950">↓</text>

  <!-- Code: Bug 2 - fix (new code) -->
  <text x="160" y="370" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#3fb950">
    t-if="!isRequired or !value and value !== 0"
  </text>
  <text x="680" y="370" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#8b949e">
    # show empty option
  </text>

  <!-- Commit hash -->
  <text x="160" y="430" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#58a6ff">
    commit 0a14b48
  </text>
  <text x="325" y="430" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">
    Fix Werkzeug charset compat and Odoo 16 selection field validation bug
  </text>

  <!-- Title -->
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="1">
    OCA mail_gateway bugfix
  </text>
  <text x="600" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.45" letter-spacing="2">
    ODOO 16 + WERKZEUG 3.x + OWL
  </text>

  <!-- Issue badge -->
  <rect x="490" y="585" width="220" height="28" rx="14" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="604" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#58a6ff">
    odoo/odoo#184664
  </text>
</svg>
