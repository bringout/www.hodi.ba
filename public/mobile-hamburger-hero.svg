<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Mobile hamburger menu on www.hodi.ba — phone mockup showing a collapsed navigation toggle and an opened drawer with links">
  <title>Mobilni hamburger meni — www.hodi.ba</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e9688"/>
      <stop offset="55%" stop-color="#095950"/>
      <stop offset="100%" stop-color="#021f1c"/>
    </radialGradient>
    <linearGradient id="phoneGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f3f6f8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="drawerFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle dot grid (same rhythm as other hero svgs) -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="180" cy="60" r="2"/>
    <circle cx="300" cy="60" r="2"/>
    <circle cx="420" cy="60" r="2"/>
    <circle cx="540" cy="60" r="2"/>
    <circle cx="660" cy="60" r="2"/>
    <circle cx="780" cy="60" r="2"/>
    <circle cx="900" cy="60" r="2"/>
    <circle cx="1020" cy="60" r="2"/>
    <circle cx="1140" cy="60" r="2"/>
    <circle cx="60" cy="180" r="2"/>
    <circle cx="180" cy="180" r="2"/>
    <circle cx="300" cy="180" r="2"/>
    <circle cx="900" cy="180" r="2"/>
    <circle cx="1020" cy="180" r="2"/>
    <circle cx="1140" cy="180" r="2"/>
    <circle cx="60" cy="300" r="2"/>
    <circle cx="180" cy="300" r="2"/>
    <circle cx="1020" cy="300" r="2"/>
    <circle cx="1140" cy="300" r="2"/>
    <circle cx="60" cy="450" r="2"/>
    <circle cx="180" cy="450" r="2"/>
    <circle cx="300" cy="450" r="2"/>
    <circle cx="900" cy="450" r="2"/>
    <circle cx="1020" cy="450" r="2"/>
    <circle cx="1140" cy="450" r="2"/>
    <circle cx="60" cy="570" r="2"/>
    <circle cx="180" cy="570" r="2"/>
    <circle cx="300" cy="570" r="2"/>
    <circle cx="420" cy="570" r="2"/>
    <circle cx="540" cy="570" r="2"/>
    <circle cx="660" cy="570" r="2"/>
    <circle cx="780" cy="570" r="2"/>
    <circle cx="900" cy="570" r="2"/>
    <circle cx="1020" cy="570" r="2"/>
    <circle cx="1140" cy="570" r="2"/>
  </g>

  <!-- title text (top) -->
  <text x="600" y="88" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#ffffff" letter-spacing="1">
    Mobilni hamburger meni
  </text>
  <text x="600" y="118" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" font-weight="400" fill="#ffffff" fill-opacity="0.75" letter-spacing="2">
    www.hodi.ba — responsive header, čisti CSS
  </text>

  <!-- phone 1: closed (hamburger icon visible) -->
  <g transform="translate(390 180)" filter="url(#softShadow)">
    <!-- phone body -->
    <rect x="0" y="0" width="210" height="400" rx="28" ry="28" fill="#0b1220"/>
    <!-- screen -->
    <rect x="10" y="10" width="190" height="380" rx="20" ry="20" fill="url(#phoneGlass)"/>
    <!-- notch -->
    <rect x="80" y="16" width="50" height="8" rx="4" ry="4" fill="#0b1220"/>

    <!-- app header bar -->
    <rect x="18" y="38" width="174" height="44" fill="#ffffff"/>
    <!-- hodi! mini logo (h in square) -->
    <rect x="28" y="48" width="24" height="26" rx="4" ry="4" fill="#002F6C"/>
    <text x="40" y="68" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="20" font-weight="800" fill="#FFD700">h</text>
    <text x="56" y="68"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="18" font-weight="800" fill="#002F6C">odi!</text>
    <!-- hamburger icon (3 lines, highlighted) -->
    <g stroke="#002F6C" stroke-width="3" stroke-linecap="round">
      <line x1="158" y1="54" x2="182" y2="54"/>
      <line x1="158" y1="61" x2="182" y2="61"/>
      <line x1="158" y1="68" x2="182" y2="68"/>
    </g>
    <!-- divider under header -->
    <line x1="18" y1="82" x2="192" y2="82" stroke="#e5e9f0" stroke-width="1"/>

    <!-- hero content inside phone -->
    <!-- big hodi! logo, tightened -->
    <g transform="translate(105 180)">
      <rect x="-38" y="-48" width="66" height="78" rx="12" ry="12" fill="#002F6C"/>
      <text x="-5" y="12" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="62" font-weight="800" fill="#FFD700">h</text>
      <text x="40" y="12"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="48" font-weight="800" font-style="italic" fill="#002F6C">odi!</text>
    </g>
    <text x="105" y="270" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="22" font-weight="500" fill="#60739f">Dobrodošli!</text>

    <!-- footer strip -->
    <rect x="10" y="356" width="190" height="34" fill="#f0f3f7"/>
    <text x="105" y="378" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="12" font-weight="400" fill="#8b9bbf">© 2026 hodi.ba</text>
  </g>

  <!-- tap indicator between the two phones -->
  <g transform="translate(625 238)">
    <circle cx="0" cy="0" r="22" fill="#FFD700" fill-opacity="0.25"/>
    <circle cx="0" cy="0" r="14" fill="#FFD700" fill-opacity="0.55"/>
    <circle cx="0" cy="0" r="6" fill="#FFD700"/>
  </g>
  <g stroke="#FFD700" stroke-width="3" stroke-linecap="round" fill="none" stroke-opacity="0.85">
    <path d="M 655 238 L 690 238" stroke-dasharray="6 6"/>
    <path d="M 686 230 L 700 238 L 686 246"/>
  </g>

  <!-- phone 2: open (drawer expanded) -->
  <g transform="translate(720 180)" filter="url(#softShadow)">
    <!-- phone body -->
    <rect x="0" y="0" width="210" height="400" rx="28" ry="28" fill="#0b1220"/>
    <!-- screen -->
    <rect x="10" y="10" width="190" height="380" rx="20" ry="20" fill="url(#phoneGlass)"/>
    <!-- notch -->
    <rect x="80" y="16" width="50" height="8" rx="4" ry="4" fill="#0b1220"/>

    <!-- app header bar -->
    <rect x="18" y="38" width="174" height="44" fill="#ffffff"/>
    <!-- hodi! mini logo -->
    <rect x="28" y="48" width="24" height="26" rx="4" ry="4" fill="#002F6C"/>
    <text x="40" y="68" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="20" font-weight="800" fill="#FFD700">h</text>
    <text x="56" y="68"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="18" font-weight="800" fill="#002F6C">odi!</text>
    <!-- close (X) icon - hamburger transformed -->
    <g stroke="#002F6C" stroke-width="3" stroke-linecap="round">
      <line x1="160" y1="52" x2="180" y2="72"/>
      <line x1="180" y1="52" x2="160" y2="72"/>
    </g>
    <line x1="18" y1="82" x2="192" y2="82" stroke="#e5e9f0" stroke-width="1"/>

    <!-- drawer (dropped under the header) -->
    <g>
      <rect x="18" y="82" width="174" height="245" fill="url(#drawerFill)"/>
      <!-- drawer items -->
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
         font-size="15" font-weight="500" fill="#0f1219">
        <!-- Početna (active) -->
        <rect x="18" y="86" width="174" height="42" fill="#e9edf4"/>
        <rect x="18" y="86" width="4" height="42" fill="#002F6C"/>
        <text x="38" y="112">Početna</text>
        <line x1="28" y1="127" x2="182" y2="127" stroke="#e5e9f0" stroke-width="1"/>
        <!-- O nama -->
        <text x="38" y="154">O nama</text>
        <line x1="28" y1="168" x2="182" y2="168" stroke="#e5e9f0" stroke-width="1"/>
        <!-- Blog -->
        <text x="38" y="194">Blog</text>
        <line x1="28" y1="208" x2="182" y2="208" stroke="#e5e9f0" stroke-width="1"/>
        <!-- KEP verifikator -->
        <text x="38" y="234">KEP verifikator</text>
        <line x1="28" y1="248" x2="182" y2="248" stroke="#e5e9f0" stroke-width="1"/>
        <!-- Webmail -->
        <text x="38" y="274">Webmail</text>
      </g>
      <!-- subtle drop shadow below drawer -->
      <rect x="18" y="327" width="174" height="4" fill="#000000" fill-opacity="0.06"/>
    </g>

    <!-- footer strip -->
    <rect x="10" y="356" width="190" height="34" fill="#f0f3f7"/>
    <text x="105" y="378" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="12" font-weight="400" fill="#8b9bbf">© 2026 hodi.ba</text>
  </g>

  <!-- caption under phones -->
  <text x="495" y="610" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.75" letter-spacing="1">
    zatvoreno
  </text>
  <text x="825" y="610" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.75" letter-spacing="1">
    otvoreno (drawer)
  </text>
</svg>
