<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-label="l10n_ba_partner_merge — pametno spajanje duplikata">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#2c3a5d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#e2c781"/>
      <stop offset="100%" stop-color="#d2b76a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <g font-family="'DejaVu Sans', 'Inter', system-ui, sans-serif" fill="#f0f0f0">
    <text x="60" y="92" font-size="46" font-weight="700">l10n_ba_partner_merge</text>
    <text x="60" y="132" font-size="22" fill="#a8b3cc" font-weight="400">
      pametno spajanje duplikata partnera nakon auto-importa izvoda
    </text>
  </g>

  <g font-family="'DejaVu Sans', sans-serif">
    <!-- Three duplicate cards lined up; rich one highlighted -->
    <g transform="translate(60, 200)">
      <rect width="320" height="170" rx="8" fill="#3a4d75" opacity="0.45"/>
      <text x="20" y="36" font-size="13" letter-spacing="3" fill="#a8b3cc">poor (auto-kreiran)</text>
      <text x="20" y="68" font-size="22" fill="#ffffff" font-weight="600">PARTNER A doo</text>
      <text x="20" y="98" font-size="14" fill="#a8b3cc">vat: —</text>
      <text x="20" y="118" font-size="14" fill="#a8b3cc">jib: —</text>
      <text x="20" y="138" font-size="14" fill="#a8b3cc">grad: —</text>
      <text x="20" y="158" font-size="14" fill="#ef6f6c" font-weight="700">score = 0</text>
    </g>
    <g transform="translate(420, 200)">
      <rect width="320" height="170" rx="8" fill="#3a4d75" opacity="0.45"/>
      <text x="20" y="36" font-size="13" letter-spacing="3" fill="#a8b3cc">medium</text>
      <text x="20" y="68" font-size="22" fill="#ffffff" font-weight="600">PARTNER A doo</text>
      <text x="20" y="98" font-size="14" fill="#a8b3cc">vat: —</text>
      <text x="20" y="118" font-size="14" fill="#a8b3cc">grad: Sarajevo</text>
      <text x="20" y="138" font-size="14" fill="#a8b3cc">tel: +387 33 …</text>
      <text x="20" y="158" font-size="14" fill="#e2c781" font-weight="700">score = 3</text>
    </g>
    <g transform="translate(780, 200)">
      <rect width="360" height="170" rx="8" fill="#3a4d75" opacity="0.65" stroke="#92e0b2" stroke-width="3"/>
      <text x="20" y="36" font-size="13" letter-spacing="3" fill="#92e0b2">★ rich (pobjednik)</text>
      <text x="20" y="68" font-size="22" fill="#ffffff" font-weight="700">PARTNER A d.o.o.</text>
      <text x="20" y="98" font-size="14" fill="#92e0b2">vat: 200001234567</text>
      <text x="20" y="118" font-size="14" fill="#92e0b2">jib: 4200012345001</text>
      <text x="20" y="138" font-size="14" fill="#92e0b2">grad: Sarajevo, BiH</text>
      <text x="20" y="158" font-size="14" fill="#92e0b2" font-weight="700">score = 31</text>
    </g>
  </g>

  <!-- Arrow + summary -->
  <g font-family="'DejaVu Sans', sans-serif">
    <text x="60" y="430" font-size="16" fill="#a8b3cc">
      → Sve reference (account, purchase, stock, mail, …) se preusmjeravaju ka pobjedniku
    </text>
    <text x="60" y="458" font-size="16" fill="#a8b3cc">
      → Gubitnici se <tspan fill="#e2c781">arhiviraju</tspan> (ne brišu) — audit trag ostaje
    </text>
    <text x="60" y="486" font-size="16" fill="#a8b3cc">
      → Pretraga po dijelu imena · pametan prijedlog odredišta · ručna selekcija duplikata
    </text>
  </g>

  <rect x="0" y="600" width="1200" height="30" fill="url(#accent)"/>
  <text x="60" y="620" font-family="'DejaVu Sans', sans-serif"
        font-size="14" fill="#1f2a44" font-weight="600">
    bring.out d.o.o. Sarajevo  ·  www.bring.out.ba
  </text>
</svg>
