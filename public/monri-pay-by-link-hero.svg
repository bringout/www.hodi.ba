<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="pbl-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#2c3e6b"/>
    </linearGradient>
    <linearGradient id="pbl-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b7bec"/>
      <stop offset="100%" stop-color="#0b5fb5"/>
    </linearGradient>
    <linearGradient id="pbl-doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e9f2"/>
    </linearGradient>
    <linearGradient id="pbl-btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38d17a"/>
      <stop offset="100%" stop-color="#14a55d"/>
    </linearGradient>
    <filter id="pbl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#pbl-bg)"/>

  <!-- Soft grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Glow behind credit card -->
  <circle cx="900" cy="350" r="170" fill="#4b7bec" fill-opacity="0.18"/>

  <!-- Document / Quotation (left) -->
  <g filter="url(#pbl-shadow)" transform="translate(110 115)">
    <rect width="340" height="400" rx="14" fill="url(#pbl-doc)"/>
    <!-- Document header -->
    <rect x="24" y="30" width="200" height="18" rx="4" fill="#2c3e6b"/>
    <rect x="24" y="58" width="140" height="10" rx="3" fill="#96a4c1"/>
    <!-- Badge -->
    <g transform="translate(260 28)">
      <rect width="60" height="24" rx="12" fill="#ff8c42" fill-opacity="0.2" stroke="#ff8c42" stroke-width="1.5"/>
      <text x="30" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ff8c42">RFQ</text>
    </g>
    <!-- Item lines -->
    <g fill="#b3bdd4">
      <rect x="24" y="96" width="292" height="8" rx="2"/>
      <rect x="24" y="116" width="260" height="8" rx="2"/>
      <rect x="24" y="136" width="220" height="8" rx="2"/>
    </g>
    <!-- Payment term box -->
    <g transform="translate(24 172)">
      <rect width="292" height="58" rx="8" fill="#eef2fb" stroke="#b3bdd4" stroke-width="1"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#2c3e6b">Uslovi plaćanja</text>
      <text x="14" y="42" font-family="sans-serif" font-size="13" font-weight="600" fill="#0b5fb5">Monri Pay By Link</text>
    </g>
    <!-- Note block -->
    <g transform="translate(24 248)">
      <rect width="292" height="128" rx="8" fill="#fff9e6" stroke="#f7c948" stroke-width="1"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#b8841a">Napomena</text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#6b5a1a">Čeka se plaćanje.</text>
      <text x="14" y="62" font-family="sans-serif" font-size="11" fill="#6b5a1a">Link za plaćanje:</text>
      <g transform="translate(14 72)">
        <rect width="264" height="24" rx="4" fill="#ffffff" stroke="#f7c948" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="10" fill="#0b5fb5">https://ipgtest.monri.com/v2/...</text>
      </g>
      <text x="14" y="118" font-family="sans-serif" font-size="11" font-weight="600" fill="#6b5a1a">Iznos: 149,00 BAM</text>
    </g>
  </g>

  <!-- Link / arrow in the middle -->
  <g transform="translate(470 300)">
    <!-- Chain link icon -->
    <g stroke="#4b7bec" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 20 30 L 60 30 A 20 20 0 0 0 60 -10 L 40 -10"/>
      <path d="M 100 30 L 60 30 A 20 20 0 0 1 60 70 L 80 70"/>
    </g>
    <!-- Arrow -->
    <g transform="translate(150 10)">
      <line x1="0" y1="20" x2="130" y2="20" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-dasharray="10,8"/>
      <polygon points="130,8 150,20 130,32" fill="#ffffff" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- Credit card + button (right) -->
  <g filter="url(#pbl-shadow)" transform="translate(780 180)">
    <!-- Card -->
    <rect width="320" height="200" rx="16" fill="url(#pbl-card)"/>
    <!-- Chip -->
    <rect x="28" y="40" width="44" height="34" rx="6" fill="#f1c40f" fill-opacity="0.85"/>
    <rect x="32" y="48" width="36" height="2" fill="#d4a00b" opacity="0.6"/>
    <rect x="32" y="54" width="36" height="2" fill="#d4a00b" opacity="0.6"/>
    <rect x="32" y="60" width="36" height="2" fill="#d4a00b" opacity="0.6"/>
    <!-- Contactless -->
    <g transform="translate(240 46)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M 0 0 A 18 18 0 0 1 0 32"/>
      <path d="M 10 4 A 12 12 0 0 1 10 24"/>
      <path d="M 20 8 A 6 6 0 0 1 20 20"/>
    </g>
    <!-- Card number -->
    <g fill="#ffffff" font-family="monospace" font-size="22" letter-spacing="2">
      <text x="28" y="128">4242  ••••  ••••  4242</text>
    </g>
    <text x="28" y="170" font-family="sans-serif" font-size="11" fill="#c8d6e8" opacity="0.8">MONRI PAY BY LINK</text>
    <text x="212" y="170" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff">BAM</text>
  </g>

  <!-- Pay button below card -->
  <g filter="url(#pbl-shadow)" transform="translate(840 410)">
    <rect width="200" height="52" rx="10" fill="url(#pbl-btn)"/>
    <text x="100" y="33" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">Plati karticom</text>
  </g>

  <!-- Title text -->
  <g font-family="sans-serif" fill="#ffffff">
    <text x="110" y="76" font-size="36" font-weight="700">Monri Pay By Link</text>
    <text x="110" y="104" font-size="18" font-weight="400" fill="#c8d6e8">Iz prodajne narudžbe — bez e-commerce-a</text>
  </g>

  <!-- Footer version badge -->
  <g transform="translate(1000 560)">
    <rect width="160" height="40" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <text x="80" y="25" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffffff" opacity="0.85">v 16.0.2.5.1</text>
  </g>
</svg>
