<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2AABEE"/>
      <stop offset="100%" stop-color="#229ED9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="5" fill="#2AABEE"/>
  <!-- Forum/Topics icon -->
  <g transform="translate(900, 120)" opacity="0.15">
    <rect x="0" y="0" width="220" height="160" rx="12" stroke="#2AABEE" stroke-width="2.5" fill="none"/>
    <line x1="0" y1="40" x2="220" y2="40" stroke="#2AABEE" stroke-width="1.5"/>
    <rect x="12" y="52" width="196" height="24" rx="4" stroke="#4ade80" stroke-width="1" fill="none" opacity="0.6"/>
    <rect x="12" y="84" width="196" height="24" rx="4" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.6"/>
    <rect x="12" y="116" width="196" height="24" rx="4" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.6"/>
    <text x="110" y="28" font-family="monospace" font-size="14" fill="#2AABEE" text-anchor="middle">Forum Topics</text>
  </g>
  <!-- Odoo icon -->
  <g transform="translate(80, 180)" opacity="0.2">
    <circle cx="40" cy="40" r="35" stroke="#714B67" stroke-width="3" fill="none"/>
    <text x="40" y="50" font-family="system-ui" font-size="28" fill="#714B67" text-anchor="middle" font-weight="700">O</text>
  </g>
  <!-- Arrow from Odoo to Forum -->
  <g transform="translate(170, 210)" opacity="0.15">
    <path d="M0 0 Q200 -40 700 -70" stroke="#4ade80" stroke-width="2" fill="none" stroke-dasharray="8 4"/>
    <path d="M690 -75 L710 -70 L695 -58" stroke="#4ade80" stroke-width="2" fill="none"/>
  </g>
  <!-- Telegram icon -->
  <g transform="translate(80, 280)" opacity="0.2">
    <circle cx="20" cy="20" r="18" fill="url(#tg)"/>
    <path d="M30 12L18 18c-.8.3-.8.8-.15 1l2.9.9 1.1 3.5c.15.35.1.5.5.5l-.45-2.1 8-7.2c.35-.3-.1-.45-.5-.2L20 23l-.05.05-.35 1.7c.35 0 .5-.15.65-.35l1.6-1.6 3.3 2.5c.6.35 1 .15 1.2-.55l2.2-10.4c.2-.8-.3-1.2-.85-.95z" fill="#fff" transform="scale(0.7)"/>
  </g>
  <!-- Feature list -->
  <g fill="#4ade80" font-family="monospace" font-size="15">
    <g transform="translate(80, 340)">
      <path d="M0 10 L7 17 L18 4" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="14" fill="#94a3b8">Auto-create forum topic per partner on first message</text>
    </g>
    <g transform="translate(80, 370)">
      <path d="M0 10 L7 17 L18 4" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="14" fill="#94a3b8">Forward incoming partner messages to topic</text>
    </g>
    <g transform="translate(80, 400)">
      <path d="M0 10 L7 17 L18 4" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="14" fill="#94a3b8">Forward outgoing Odoo replies to topic</text>
    </g>
    <g transform="translate(80, 430)">
      <path d="M0 10 L7 17 L18 4" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="14" fill="#94a3b8">Detect Groups wizard in Odoo gateway UI</text>
    </g>
    <g transform="translate(80, 460)">
      <path d="M0 10 L7 17 L18 4" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="14" fill="#94a3b8">Team visibility on mobile Telegram clients</text>
    </g>
  </g>
  <!-- Title -->
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#2AABEE">Odoo 16 + Telegram</text>
  <text x="80" y="140" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Iteracija 4: Partner Forum</text>
  <text x="80" y="175" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Automatski forum topici za mobilnu vidljivost tima</text>
  <!-- Badges -->
  <rect x="80" y="530" width="120" height="30" rx="6" fill="#0f3460"/>
  <text x="140" y="550" font-family="monospace" font-size="13" fill="#60a5fa" text-anchor="middle">Odoo 16.0</text>
  <rect x="210" y="530" width="80" height="30" rx="6" fill="#1e3a5f"/>
  <text x="250" y="550" font-family="monospace" font-size="13" fill="#2AABEE" text-anchor="middle">Telegram</text>
  <rect x="300" y="530" width="110" height="30" rx="6" fill="#1e3a5f"/>
  <text x="355" y="550" font-family="monospace" font-size="13" fill="#4ade80" text-anchor="middle">Forum API</text>
  <rect x="420" y="530" width="70" height="30" rx="6" fill="#1e3a5f"/>
  <text x="455" y="550" font-family="monospace" font-size="13" fill="#60a5fa" text-anchor="middle">OCA</text>
  <!-- Date -->
  <text x="1120" y="600" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">2026-04-13 | hodi.ba</text>
